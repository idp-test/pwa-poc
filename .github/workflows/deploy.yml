name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all apps
        run: npm run build

      - name: Prepare deployment directory
        run: |
          rm -rf deploy
          mkdir deploy

          for app_dir in apps/*/; do
            app_name=$(basename "$app_dir")
            if [ -d "${app_dir}dist" ]; then
              echo "Copying $app_name..."
              mkdir -p "deploy/$app_name"
              cp -r "${app_dir}dist/"* "deploy/$app_name/"
            fi
          done

      - name: Generate root index and service worker killer
        run: |
          # Create a service worker that unregisters old service workers
          cat > deploy/sw.js << 'SWEOF'
          // This service worker unregisters itself and clears old caches
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', async () => {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
            const clients = await self.clients.matchAll({ type: 'window' });
            clients.forEach(client => client.navigate(client.url));
            self.registration.unregister();
          });
          SWEOF

          # Create index page that also clears service workers
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          SHORT_SHA=${GITHUB_SHA::7}

          cat > deploy/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PWA Apps</title>
            <style>
              * { box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, sans-serif;
                max-width: 600px;
                margin: 2rem auto;
                padding: 1rem;
                background: #1a1a2e;
                color: #eee;
                min-height: 100vh;
              }
              h1 { text-align: center; margin-bottom: 2rem; }
              .apps { display: flex; flex-direction: column; gap: 1rem; }
              a.app-link {
                display: block;
                padding: 1.5rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                text-decoration: none;
                border-radius: 12px;
                font-size: 1.2rem;
                font-weight: 600;
                text-align: center;
              }
              .build-info {
                margin-top: 3rem;
                padding-top: 1rem;
                border-top: 1px solid #333;
                font-size: 0.75rem;
                color: #666;
                text-align: center;
              }
              .build-info a {
                color: #888;
                text-decoration: none;
              }
              .build-info a:hover {
                text-decoration: underline;
              }
            </style>
            <script>
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                  registrations.forEach(reg => {
                    if (reg.scope.endsWith('/pwa-poc/') && !reg.scope.endsWith('/pwa-poc/todo/')) {
                      reg.unregister();
                    }
                  });
                });
                navigator.serviceWorker.register('./sw.js').catch(() => {});
              }
            </script>
          </head>
          <body>
            <h1>PWA Apps</h1>
            <div class="apps">
              <a class="app-link" href="./todo/">Todo List</a>
            </div>
            <div class="build-info">
              Built: ${BUILD_DATE}<br>
              Commit: <a href="https://github.com/idp-test/pwa-poc/commit/${GITHUB_SHA}">${SHORT_SHA}</a>
            </div>
          </body>
          </html>
          HTMLEOF

          # Verification file
          echo "Deployed: $(date -u)" > deploy/_deployed.txt
          echo "Commit: $GITHUB_SHA" >> deploy/_deployed.txt

          echo "=== Deploy contents ==="
          find deploy -type f
          echo "=== index.html ==="
          head -20 deploy/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
