name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all apps
        run: npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy

          # Copy each app's dist to deploy/{app-name}
          for app_dir in apps/*/; do
            app_name=$(basename "$app_dir")
            if [ -d "${app_dir}dist" ]; then
              echo "Copying $app_name..."
              mkdir -p "deploy/$app_name"
              cp -r "${app_dir}dist/"* "deploy/$app_name/"
            fi
          done

          # List what we have
          echo "Deploy structure:"
          find deploy -type f | head -20

      - name: Generate index page
        run: |
          cat > deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PWA Apps</title>
            <style>
              * { box-sizing: border-box; }
              body {
                font-family: system-ui, -apple-system, sans-serif;
                max-width: 600px;
                margin: 2rem auto;
                padding: 1rem;
                background: #1a1a2e;
                color: #eee;
                min-height: 100vh;
              }
              h1 { text-align: center; margin-bottom: 2rem; }
              .apps { display: flex; flex-direction: column; gap: 1rem; }
              a {
                display: block;
                padding: 1.5rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                text-decoration: none;
                border-radius: 12px;
                font-size: 1.2rem;
                font-weight: 600;
                text-align: center;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              a:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
              }
            </style>
          </head>
          <body>
            <h1>PWA Apps</h1>
            <div class="apps">
          HTMLEOF

          for app_dir in apps/*/; do
            app_name=$(basename "$app_dir")
            if [ -d "deploy/$app_name" ]; then
              echo "      <a href=\"./$app_name/\">$app_name</a>" >> deploy/index.html
            fi
          done

          cat >> deploy/index.html << 'HTMLEOF'
            </div>
          </body>
          </html>
          HTMLEOF

          echo "Generated index.html:"
          cat deploy/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
